services:
  sheets:
    build: .
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/sheets
      DB_USER: sheets
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: sheets
      POSTGRES_USER: sheets
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    volumes:
      - sheets-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sheets -d sheets"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
volumes:
  sheets-postgres:
